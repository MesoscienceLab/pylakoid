[project]
name = "pylakoid"
version = "0.1.0"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "biopython==1.86",
  "equinox==0.13.2",
  "jax==0.8.1",
  "jaxtyping==0.3.3",
  "matplotlib==3.10.7",
  "numpy==2.3.5",
  "pydantic==2.12.5",
  "safetensors==0.7.0",
  "scipy==1.16.3",
  "shapely==2.1.2",
  "typer==0.21.1",
]

[project.scripts]
pylakoid = "pylakoid.cli:app"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.0",
    "mkdocstrings-python==2.0.0",
    "pyright==1.1.408",
    "pytest==9.0.1",
    "ruff==0.14.7",
]

[tool.pyright]
typeCheckingMode = "strict"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "Q", "TID252"]
ignore = ["F722"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
